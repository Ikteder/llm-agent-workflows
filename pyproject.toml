[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-workflows"
version = "0.3.0"
description = "An experiment and knowledge workflow agent over research artifacts, logs, and metrics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "numpy>=2.1,<3",
    "pandas>=2.3,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
frontend = ["requests>=2.32,<3", "streamlit>=1.48,<2"]
openai = ["openai>=1.99,<3"]
embeddings = ["sentence-transformers>=5.1,<6"]
dev = ["build>=1.3,<2", "httpx>=0.28,<1", "pip-audit>=2.9,<3", "pytest>=8.4,<10", "ruff>=0.13,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
